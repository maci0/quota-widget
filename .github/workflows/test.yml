name: test

on:
  push:
  pull_request:

# The gate only reads the tree, so the token needs nothing but the checkout.
permissions:
  contents: read

# A push to a branch with an open PR supersedes its own earlier run; main keeps
# every run so the history of the default branch stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to the commit behind the tag, so a
      # moved tag cannot change what the gate runs. Dependabot opens the bump
      # PR; the version in the comment is what it updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token stays out of .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.13"
          # uv sync is the slowest step; the cache key is uv.lock.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --extra dev --frozen
      - run: uv run black --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: shellcheck install.sh
