name: test

on:
  push:
  pull_request:

# The gate only reads the tree, so the token needs nothing but the checkout.
permissions:
  contents: read

# A push to a branch with an open PR supersedes its own earlier run; main keeps
# every run so the history of the default branch stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # A pinned image, not ubuntu-latest: the moving tag would change the
    # system python and shellcheck under the gate without a commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The gate reads dates, so the runner's zone and locale must not decide
    # what a test sees. Both are set here rather than inherited.
    env:
      TZ: UTC
      LC_ALL: C.UTF-8
    steps:
      # Third-party actions are pinned to the commit behind the tag, so a
      # moved tag cannot change what the gate runs. Dependabot opens the bump
      # PR; the version in the comment is what it updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No step pushes, so the token stays out of .git/config.
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.13"
          # uv sync is the slowest step; the cache key is uv.lock.
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # --locked, not --frozen: it asserts uv.lock still matches pyproject.toml,
      # so a declared gate tool that never reached the lock fails here instead
      # of running the previous one.
      - run: uv sync --extra dev --locked
      - run: uv run black --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: shellcheck install.sh
