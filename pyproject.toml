[project]
name = "quota-widget"
version = "1.1.0"
description = "KDE Plasma 6 widget for Claude, Cursor, Codex, and Grok usage quotas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '''\.pyi?$'''

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["package/contents/code", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "ERA",  # dead code
    "FLY",  # string formatting
    "G",    # logging format
    "INT",  # gettext
    "ISC",  # implicit string concat
    "N",    # naming
    "PERF",  # perflint
    "PIE",  # misc lints
    "PTH",  # os.path to pathlib
    "RET",  # return statements
    "RUF",  # ruff specific
]

[tool.ruff.lint.per-file-ignores]
# A test asserts; that is the assertion API. S105 and S108 fire on fixture
# names for a token or a temp path, and RUF001 on a real UI string.
"tests/*" = ["S101", "S105", "S108", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "package/contents/code"
files = ["package/contents/code/fetch_quota.py", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["package/contents/code", "scripts"]
