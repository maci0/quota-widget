[project]
name = "quota-widget"
version = "1.1.0"
description = "KDE Plasma 6 widget for Claude, Cursor, Codex, and Grok usage quotas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The fetcher that plasmashell runs is stdlib only, so every dependency here is
# a gate tool and none of it ships. Each is floored at the reviewed release and
# capped below its next major, so a re-lock cannot pull an unreviewed major into
# the gate: black 25 and 26 restyle code, mypy 2 drops 1.x defaults, and pytest
# 9 changes collection and warning behavior, so a wide range resolves to a tool
# that fails or silently rewrites the gate.
[project.optional-dependencies]
dev = [
    "black>=26.5,<27",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '''\.pyi?$'''

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["package/contents/code", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "ERA",  # dead code
    "FLY",  # string formatting
    "G",    # logging format
    "INT",  # gettext
    "ISC",  # implicit string concat
    "N",    # naming
    "PERF",  # perflint
    "PIE",  # misc lints
    "PTH",  # os.path to pathlib
    "RET",  # return statements
    "RUF",  # ruff specific
]

[tool.ruff.lint.per-file-ignores]
# A test asserts; that is the assertion API. S105 and S108 fire on fixture
# names for a token or a temp path, and RUF001 on a real UI string.
"tests/*" = ["S101", "S105", "S108", "RUF001"]
# The fuzzer needs a reproducible stream, not a secure one: every generator is
# seeded from BASE_SEED so a failure replays from the printed seed.
"tests/test_fuzz_parsers.py" = ["S311"]
# The installer test runs install.sh from this checkout with an argv the test
# builds, which is the point: S603 wants a shell=False call whose every
# argument is fixed, and the checkout path is one of them.
"tests/test_install_script.py" = ["S603"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "package/contents/code"
files = ["package/contents/code/fetch_quota.py", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["package/contents/code", "scripts", "tests"]

# CI pins setup-uv to this release, and uv.lock is revision 3. An older uv
# cannot read that revision, so the mismatch would otherwise surface as a lock
# parse error or a silently different resolution. Failing on the first uv
# command in a clean clone names the actual problem instead.
[tool.uv]
required-version = ">=0.12.13"
